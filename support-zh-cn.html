<h1>支援</h1>
<p>有问题或建议，请寄信到 〔support email〕，并写上你的 iPhone 型号和游戏版本（设置页最下方）。</p>
<h2>常见问题</h2>
<p><strong>换手机后存档会跟着过去吗？</strong></p>
<p>存档只在装置上。用 iPhone 的「备份与回复」或「快速开始」换机时，存档会一起搬过去。</p>
<p><strong>买过的东西不见了？</strong></p>
<p>到设置页按「恢复购买」，用同一个 Apple 帐号登录即可找回。</p>
<p><strong>为什么要等下一章？</strong></p>
<p>前两周可以连续玩。之后一周一章，每一章等 24 小时就免费开放，也可以看广告或使用提前券提早开。</p>
<p><strong>看不到广告？</strong></p>
<p>请确认网路连线，并关掉 VPN 再试一次。</p>
